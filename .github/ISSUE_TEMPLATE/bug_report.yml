name: Bug report
description: Something is broken or crashes
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include cookies, tokens, personal data or copyrighted pages.
  - type: input
    id: version
    attributes:
      label: Kurenai version
      placeholder: 1.0.0 (versionCode 1)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and logs
    validations:
      required: true
